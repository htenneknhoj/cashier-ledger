<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Cashier Ledger</title>
</head>
<body>
<style>
:root{
  --bg:#121C17;
  --paper-line:#2C3A32;
  --surface:#182620;
  --surface-alt:#1D2E26;
  --ink:#E9E5D6;
  --ink-soft:#8FA093;
  --green:#8FBB9C;
  --green-deep:#C7DFC9;
  --rust:#E2825B;
  --gold:#D9B65B;
  --gold-soft:#33301C;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: Georgia, "Times New Roman", Cambria, serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
.app{ min-height:100%; display:flex; flex-direction:column; }

.masthead{ padding:24px 28px 16px; border-bottom:2px solid var(--green); display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.masthead h1{ font-family:var(--serif); font-weight:700; font-size:24px; margin:0 0 4px; color:var(--green-deep); }
.masthead p{ margin:0; color:var(--ink-soft); font-size:13px; }
.masthead .who{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.masthead .who .id{ text-align:right; }
.masthead .who .id .nm{ font-family:var(--serif); font-size:14px; color:var(--green-deep); }
.masthead .who .id .rl{ font-family:var(--mono); font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.04em; }

.body-wrap{ display:flex; flex:1; min-height:0; }
.tab-rail{ width:190px; flex-shrink:0; padding:22px 0; border-right:1px solid var(--paper-line); display:flex; flex-direction:column; gap:2px; }
.tab-btn{ text-align:left; background:none; border:none; cursor:pointer; font-family:var(--serif); font-size:15px; color:var(--ink-soft); padding:12px 22px; border-left:3px solid transparent; }
.tab-btn:hover{ background:rgba(143,187,156,0.08); color:var(--ink); }
.tab-btn.active{ color:var(--green-deep); border-left-color:var(--rust); background:var(--surface); font-weight:600; }
.tab-btn .sub{ display:block; font-family:var(--sans); font-size:11px; color:var(--ink-soft); font-weight:400; margin-top:2px; }

.content{ flex:1; padding:26px 32px 60px; overflow-y:auto; }
.sheet{ max-width:1120px; margin:0 auto; background:var(--surface); border:1px solid var(--paper-line); }
.sheet-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; padding:18px 22px; border-bottom:1px solid var(--paper-line); }
.sheet-header h2{ font-family:var(--serif); font-size:19px; margin:0; color:var(--green-deep); }
.sheet-header .meta{ font-size:12.5px; color:var(--ink-soft); font-family:var(--mono); }
.branch-filter{ display:flex; align-items:center; gap:8px; }
.branch-filter select{ font-family:var(--mono); font-size:12.5px; background:var(--surface-alt); color:var(--ink); border:1px solid var(--paper-line); padding:6px 8px; }

.section{ padding:20px 22px; border-bottom:1px solid var(--paper-line); }
.section:last-child{ border-bottom:none; }
.section h3{ font-family:var(--serif); font-size:15px; margin:0 0 3px; color:var(--green); }
.section .hint{ font-size:12px; color:var(--ink-soft); margin:0 0 14px; }
.review-banner{ display:inline-flex; align-items:center; gap:6px; background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold); font-size:11.5px; padding:5px 10px; margin-bottom:12px; }

.field-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:11.5px; color:var(--ink-soft); font-weight:500; }
.field input, .field select, .field textarea{ font-family:var(--mono); font-size:13.5px; color:var(--ink); background:var(--surface-alt); border:1px solid var(--paper-line); padding:8px 9px; min-width:0; }
.field input:disabled, .field select:disabled{ opacity:.6; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--green); outline-offset:-1px; }
.field.wide input{ font-family:var(--sans); }

table.ledger{ width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
table.ledger th{ text-align:right; font-family:var(--sans); font-weight:600; font-size:11px; color:var(--ink-soft); padding:6px 8px; border-bottom:1px solid var(--paper-line); }
table.ledger th.txt, table.ledger th:first-child{ text-align:left; }
table.ledger td{ padding:4px 6px; border-bottom:1px solid var(--paper-line); vertical-align:middle; }
table.ledger input{ width:100%; font-family:var(--mono); font-size:13px; color:var(--ink); background:transparent; border:none; border-bottom:1px dashed transparent; padding:5px 3px; text-align:left; }
table.ledger input.num-input{ text-align:right; }
table.ledger input:focus{ outline:none; border-bottom:1px dashed var(--green); background:var(--gold-soft); }
table.ledger tr:hover td{ background:rgba(143,187,156,0.05); }
table.ledger td.readonly{ color:var(--green-deep); font-weight:600; text-align:right; font-family:var(--mono); }
table.ledger tfoot td{ font-weight:600; border-top:2px solid var(--green); border-bottom:none; font-family:var(--mono); color:var(--green-deep); text-align:right; }
table.ledger tfoot td:first-child{ text-align:left; font-family:var(--sans); }
table.ledger td.del-col, table.ledger th.del-col{ width:28px; padding:4px 2px; }

.row-del{ background:none; border:none; color:var(--rust); cursor:pointer; font-size:15px; padding:2px 6px; }
.row-del:hover{ background:rgba(226,130,91,0.15); }
.add-row{ margin-top:10px; background:none; border:1px dashed var(--ink-soft); color:var(--ink-soft); font-family:var(--sans); font-size:12px; padding:7px 12px; cursor:pointer; }
.add-row:hover{ border-color:var(--green); color:var(--green); }

.summary-strip{ display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--paper-line); background:var(--surface-alt); }
.summary-item{ flex:1; min-width:120px; padding:12px 16px; border-right:1px solid var(--paper-line); }
.summary-item:last-child{ border-right:none; }
.summary-item .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); }
.summary-item .val{ font-family:var(--mono); font-size:17px; font-weight:600; color:var(--green-deep); margin-top:3px; }
.summary-item.warn .val{ color:var(--rust); }
.summary-item.good .val{ color:var(--green); }

.denom-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.denom-card{ border:1px solid var(--paper-line); padding:9px 11px; background:var(--surface-alt); }
.denom-card .den-label{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); }
.denom-card .den-calc{ display:flex; align-items:center; gap:6px; margin-top:5px; }
.denom-card input{ width:56px; font-family:var(--mono); border:1px solid var(--paper-line); padding:5px; font-size:13px; background:var(--bg); color:var(--ink); text-align:right; }
.denom-card .eq{ font-size:11px; color:var(--ink-soft); }
.denom-card .subtotal{ font-family:var(--mono); font-size:13px; font-weight:600; color:var(--green-deep); }

.upload-box{ border:2px dashed var(--paper-line); padding:22px; text-align:center; cursor:pointer; background:var(--surface-alt); }
.upload-box:hover{ border-color:var(--green); background:#20332A; }
.upload-box .icon{ font-size:22px; color:var(--green); }
.upload-box .txt{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }
.thumbs{ display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
.thumb{ position:relative; width:120px; }
.thumb img{ width:120px; height:150px; object-fit:cover; border:1px solid var(--paper-line); display:block; }
.thumb .rm{ position:absolute; top:-8px; right:-8px; width:20px; height:20px; border-radius:50%; background:var(--rust); color:#1B1210; border:none; cursor:pointer; font-size:12px; line-height:1; font-weight:700; }
.thumb .fill-btn{ display:block; width:100%; margin-top:6px; font-family:var(--sans); font-size:11px; background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold); padding:5px 0; cursor:pointer; }
.thumb .fill-btn:hover{ background:var(--gold); color:#1B1210; }
.thumb .fill-btn:disabled{ opacity:.6; cursor:wait; }
.file-icon-box{ width:120px; height:150px; border:1px solid var(--paper-line); background:var(--surface-alt); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; text-align:center; }
.file-icon-box .ic{ font-size:26px; }
.file-icon-box .fn{ font-size:10px; color:var(--ink-soft); margin-top:6px; word-break:break-all; max-height:44px; overflow:hidden; }

.btn{ font-family:var(--sans); font-weight:600; font-size:13px; padding:10px 20px; border:1px solid var(--green); background:var(--green); color:#0E1712; cursor:pointer; }
.btn:hover{ background:var(--green-deep); border-color:var(--green-deep); }
.btn.secondary{ background:none; color:var(--green-deep); border-color:var(--paper-line); }
.btn.secondary:hover{ background:rgba(143,187,156,0.1); border-color:var(--green); }
.btn.danger{ background:none; border-color:var(--rust); color:var(--rust); }
.btn.danger:hover{ background:rgba(226,130,91,0.12); }
.actions-bar{ display:flex; justify-content:flex-end; gap:10px; padding:18px 22px; }
.pill-btn{ padding:7px 14px; font-size:12px; }
.pill-btn.active-pill{ background:var(--green); color:#0E1712; border-color:var(--green); }
.seed-link{ background:none; border:none; color:var(--gold); font-size:11.5px; cursor:pointer; text-decoration:underline; padding:0; }

.history-list{ display:flex; flex-direction:column; gap:10px; padding:20px 22px; }
.history-card{ border:1px solid var(--paper-line); background:var(--surface-alt); }
.history-card .hc-head{ display:flex; justify-content:space-between; align-items:center; padding:13px 16px; cursor:pointer; gap:12px; flex-wrap:wrap; }
.history-card .hc-date{ font-family:var(--serif); font-weight:600; font-size:15px; color:var(--green-deep); }
.history-card .hc-sub{ font-size:11.5px; color:var(--ink-soft); font-family:var(--mono); }
.history-card .hc-figs{ display:flex; gap:18px; font-family:var(--mono); font-size:12.5px; }
.history-card .hc-figs .f-lbl{ color:var(--ink-soft); font-size:10px; display:block; }
.history-card .hc-body{ border-top:1px solid var(--paper-line); padding:16px; display:none; }
.history-card.open .hc-body{ display:block; }
.chev{ color:var(--ink-soft); }
.history-card.open .chev{ transform:rotate(90deg); display:inline-block; }
.empty-state{ padding:50px 22px; text-align:center; color:var(--ink-soft); }
.empty-state .big{ font-family:var(--serif); font-size:16px; color:var(--ink); margin-bottom:6px; }
.pill{ display:inline-block; font-family:var(--mono); font-size:10.5px; padding:2px 7px; border:1px solid var(--paper-line); color:var(--ink-soft); }

.week-picker{ display:flex; gap:10px; align-items:flex-end; padding:18px 22px; border-bottom:1px solid var(--paper-line); flex-wrap:wrap; }
table.weekly{ width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
table.weekly th, table.weekly td{ padding:8px 10px; border-bottom:1px solid var(--paper-line); text-align:right; }
table.weekly th{ font-family:var(--sans); color:var(--ink-soft); font-size:11px; font-weight:600; }
table.weekly th:first-child, table.weekly td:first-child{ text-align:left; }
table.weekly td:first-child{ font-family:var(--serif); font-weight:600; color:var(--green-deep); }
table.weekly td{ font-family:var(--mono); }
table.weekly tfoot td{ font-weight:700; border-top:2px solid var(--green); border-bottom:none; }
.zero{ color:#4C5B51; }
.small-note{ font-size:11.5px; color:var(--ink-soft); padding:14px 22px 0; }

table.logs{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.logs th{ text-align:left; font-family:var(--sans); font-weight:600; font-size:11px; color:var(--ink-soft); padding:7px 9px; border-bottom:1px solid var(--paper-line); }
table.logs td{ padding:7px 9px; border-bottom:1px solid var(--paper-line); font-family:var(--mono); }
table.logs .act-error{ color:var(--rust); }
table.logs .act-ok{ color:var(--green); }

.login-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
.login-card{ width:100%; max-width:400px; background:var(--surface); border:1px solid var(--paper-line); padding:30px 28px; }
.login-card h2{ font-family:var(--serif); font-size:20px; color:var(--green-deep); margin:0 0 6px; }
.login-card p.sub{ color:var(--ink-soft); font-size:12.5px; margin:0 0 22px; }
.login-card .field{ margin-bottom:14px; }
.login-card .field label{ font-size:12px; margin-bottom:5px; }
.login-card .field input, .login-card .field select{ width:100%; padding:10px; font-size:14px; }
.login-note{ font-size:11px; color:var(--ink-soft); margin-top:16px; border-top:1px solid var(--paper-line); padding-top:12px; }
.trend-chart-wrap svg{ width:100%; height:auto; display:block; }

@media (max-width:760px){
  .body-wrap{ flex-direction:column; }
  .tab-rail{ width:100%; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--paper-line); padding:10px 8px; }
  .tab-btn{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
  .tab-btn.active{ border-left-color:transparent; border-bottom-color:var(--rust); }
  .content{ padding:16px; }
  .history-card .hc-figs{ display:none; }
  .masthead .who .id{ display:none; }
}
</style>

function num(v){ var n = parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; }
function fmt(n){ return n.toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'}); }
function fmtWhen(ts){ var d=new Date(ts); return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function mondayOf(iso){
  var d = new Date(iso+'T00:00:00');
  var day = d.getDay();
  var diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function rand(min,max){ return Math.round(min + Math.random()*(max-min)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function hasStorage(){ return typeof window.storage !== 'undefined' && window.storage; }

async function loadBranches(){
  if(!hasStorage()) return;
  try{
    var r = await window.storage.get('branches', true);
    if(r && r.value){ state.branches = JSON.parse(r.value); }
  }catch(e){
    try{ await window.storage.set('branches', JSON.stringify(state.branches), true); }catch(e2){}
  }
}
async function addBranch(name){
  name = (name||'').trim();
  if(!name || state.branches.indexOf(name)!==-1) return;
  state.branches.push(name);
  if(hasStorage()){ try{ await window.storage.set('branches', JSON.stringify(state.branches), true); }catch(e){} }
  await logAction('branch_added', 'Added branch "'+name+'"');
}

async function loadReports(){
  if(!hasStorage()){
    // Running as a local file with no storage API — use the embedded sample dataset instead.
    state.reports = (typeof EMBEDDED_DEMO_REPORTS !== 'undefined') ? JSON.parse(JSON.stringify(EMBEDDED_DEMO_REPORTS)) : [];
    state.reports.sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.id||'').localeCompare(a.id||''); });
    return;
  }
  try{
    var list = await window.storage.list('reports:', true);
    var keys = (list && list.keys) || [];
    var items = [];
    for(var i=0;i<keys.length;i++){
      try{ var r = await window.storage.get(keys[i], true); if(r && r.value) items.push(JSON.parse(r.value)); }catch(e){}
    }
    items.sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.id||'').localeCompare(a.id||''); });
    state.reports = items;
  }catch(e){ state.reports = []; }
}

async function saveReport(report, isEdit){
  if(!report.id){ report.id = report.date + '-' + Math.random().toString(36).slice(2,8); }
  var clean = JSON.parse(JSON.stringify(report));
  delete clean._review;
  if(!hasStorage()){ alert("You're viewing this as a local file, so it's showing sample data only — new entries can't be saved from here. Open the app through Claude to save real reports."); return false; }
  try{
    var res = await window.storage.set('reports:'+report.id, JSON.stringify(clean), true);
    if(!res) throw new Error('empty result');
    await logAction(isEdit? 'report_updated':'report_saved', (isEdit?'Updated':'Saved')+' report for '+(report.branch||'—')+' · '+report.date, report.branch);
    return true;
  }catch(e){
    await logAction('error', 'Failed to save report for '+(report.branch||'—')+' · '+report.date, report.branch);
    alert('Could not save this report. Please try again.');
    return false;
  }
}

async function deleteReport(id){
  var r = null;
  for(var i=0;i<state.reports.length;i++){ if(state.reports[i].id===id){ r = state.reports[i]; break; } }
  try{
    if(hasStorage()) await window.storage.delete('reports:'+id, true);
    state.reports = state.reports.filter(function(x){ return x.id!==id; });
    await logAction('report_deleted', 'Deleted report for '+(r? r.branch:'—')+' · '+(r? r.date:''), r? r.branch:null);
    render();
  }catch(e){
    await logAction('error', 'Failed to delete report '+id);
    alert('Could not delete this report.');
  }
}

function resizeImage(file){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var maxW = 900;
        var scale = Math.min(1, maxW/img.width);
        var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function readTextFile(file){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(ev){ resolve(String(ev.target.result).slice(0,20000)); };
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

var EXTRACT_SYSTEM = "You read daily cashier ledger sheets for a small lending business \u2014 submitted either as a photo of a handwritten/printed sheet, or as raw CSV data \u2014 and convert them into strict JSON. Return ONLY a JSON object, no markdown fences, no prose. Use this schema: {\"date\":\"YYYY-MM-DD or null\",\"preparedBy\":\"string or null\",\"branch\":\"string or null\",\"beginningCash\":number or null,\"collectors\":[{\"name\":\"string\",\"fareGas\":number,\"edc\":number,\"advance\":number,\"collection\":number,\"savings\":number}],\"releases\":[{\"fo\":\"string\",\"borrower\":\"string\",\"loan\":number,\"notary\":number,\"fees1\":number,\"fees34\":number,\"advance\":number}],\"expenses\":[{\"label\":\"string\",\"amount\":number}],\"denom\":{\"d1000\":number,\"d500\":number,\"d200\":number,\"d100\":number,\"d50\":number,\"d20\":number,\"coins\":number}}. Numbers only, no currency symbols or commas. Use 0 for missing numbers, null for missing text.";

async function callClaude(content){
  var response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, system: EXTRACT_SYSTEM, messages:[{role:"user", content: content}] })
  });
  var data = await response.json();
  var blocks = (data.content||[]).filter(function(b){ return b.type==='text'; }).map(function(b){ return b.text; }).join('\n');
  var cleaned = blocks.replace(/```json|```/g,'').trim();
  return JSON.parse(cleaned);
}
async function extractReportFromImage(dataUrl){
  var match = /^data:(image\/[a-zA-Z]+);base64,(.*)$/.exec(dataUrl);
  if(!match) throw new Error('bad image data');
  return callClaude([
    {type:"image", source:{type:"base64", media_type:match[1], data:match[2]}},
    {type:"text", text:"Extract this cashier ledger sheet photo into the JSON schema."}
  ]);
}
async function extractReportFromCSV(csvText){
  return callClaude([{type:"text", text:"Here is CSV data exported from a daily cashier ledger:\n\n"+csvText+"\n\nExtract it into the JSON schema."}]);
}

function mergeExtracted(draft, ex){
  var touched = {header:false,collectors:false,releases:false,expenses:false,denom:false};
  if(ex.date){ draft.date = ex.date; touched.header=true; }
  if(ex.preparedBy){ draft.preparedBy = ex.preparedBy; touched.header=true; }
  if(ex.branch){ draft.branch = ex.branch; touched.header=true; }
  if(ex.beginningCash!=null){ draft.beginningCash = String(ex.beginningCash); touched.header=true; }
  if(Array.isArray(ex.collectors) && ex.collectors.length){
    draft.collectors = ex.collectors.map(function(c){ return { name:c.name||'', fareGas:String(c.fareGas==null?'':c.fareGas), edc:String(c.edc==null?'':c.edc), advance:String(c.advance==null?'':c.advance), collection:String(c.collection==null?'':c.collection), savings:String(c.savings==null?'':c.savings) }; });
    touched.collectors=true;
  }
  if(Array.isArray(ex.releases) && ex.releases.length){
    draft.releases = ex.releases.map(function(x){ return { fo:x.fo||'', borrower:x.borrower||'', loan:String(x.loan==null?'':x.loan), notary:String(x.notary==null?'':x.notary), fees1:String(x.fees1==null?'':x.fees1), fees34:String(x.fees34==null?'':x.fees34), advance:String(x.advance==null?'':x.advance) }; });
    touched.releases=true;
  }
  if(Array.isArray(ex.expenses) && ex.expenses.length){
    draft.expenses = ex.expenses.map(function(x){ return { label:x.label||'', amount:String(x.amount==null?'':x.amount) }; });
    touched.expenses=true;
  }
  if(ex.denom){
    ['d1000','d500','d200','d100','d50','d20','coins'].forEach(function(k){
      if(ex.denom[k]!=null && ex.denom[k]!==0){ draft.denom[k] = String(ex.denom[k]); touched.denom=true; }
    });
  }
  if(!draft._review) draft._review = {header:false,collectors:false,releases:false,expenses:false,denom:false};
  Object.keys(touched).forEach(function(k){ if(touched[k]) draft._review[k]=true; });
}

async function seedSampleData(days, branch, onProgress){
  if(!hasStorage()){ alert('Storage is not available in this environment.'); return 0; }
  if(state.branches.indexOf(branch)===-1) await addBranch(branch);
  var existingDates = {};
  state.reports.forEach(function(r){ if(r.branch===branch) existingDates[r.date]=true; });
  var today = new Date();
  var done = 0, created = 0;
  for(var i=days-1;i>=0;i--){
    var d = new Date(today); d.setDate(d.getDate()-i);
    if(d.getDay()===0) continue;
    var dateStr = d.toISOString().slice(0,10);
    done++;
    if(onProgress) onProgress(done, days);
    if(existingDates[dateStr]) continue;
    var report = generateSampleReport(dateStr, branch);
    var clean = JSON.parse(JSON.stringify(report));
    delete clean._review;
    clean.id = dateStr + '-seed-' + Math.random().toString(36).slice(2,8);
    try{ await window.storage.set('reports:'+clean.id, JSON.stringify(clean), true); created++; }catch(e){}
  }
  await logAction('seed_demo_data', 'Seeded '+created+' new business-day reports for '+branch, branch);
  return created;
}

/* ============================== COMPUTATIONS ============================== */
function computeTotals(r){
  var collTotal=0, savingsTotal=0, edcTotal=0, advTotal=0, fareTotal=0;
  r.collectors.forEach(function(c){ collTotal+=num(c.collection); savingsTotal+=num(c.savings); edcTotal+=num(c.edc); advTotal+=num(c.advance); fareTotal+=num(c.fareGas); });
  var loanTotal=0, relAdvTotal=0, netTotal=0;
  r.releases.forEach(function(x){ loanTotal+=num(x.loan); relAdvTotal+=num(x.advance); netTotal += num(x.loan)-num(x.notary)-num(x.fees1)-num(x.fees34)-num(x.advance); });
  var expTotal = fareTotal; r.expenses.forEach(function(x){ expTotal+=num(x.amount); });
  var denomTotal = num(r.denom.d1000)*1000 + num(r.denom.d500)*500 + num(r.denom.d200)*200 + num(r.denom.d100)*100 + num(r.denom.d50)*50 + num(r.denom.d20)*20 + num(r.denom.coins);
  var expectedCash = num(r.beginningCash) + collTotal - netTotal - expTotal - relAdvTotal;
  var variance = denomTotal - expectedCash;
  return {collTotal:collTotal,savingsTotal:savingsTotal,edcTotal:edcTotal,advTotal:advTotal,fareTotal:fareTotal,loanTotal:loanTotal,relAdvTotal:relAdvTotal,netTotal:netTotal,expTotal:expTotal,denomTotal:denomTotal,expectedCash:expectedCash,variance:variance};
}

}

/* ============================== TRENDS ============================== */
function buildDateRange(rangeDays){
  var end = new Date(); end.setHours(0,0,0,0);
  var days = [];
  for(var i=rangeDays-1;i>=0;i--){
    var d = new Date(end); d.setDate(d.getDate()-i);
    if(d.getDay()===0) continue;
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}
function metricTotalForReport(report, metricKey){
  var t = computeTotals(report);
  if(metricKey==='collection') return t.collTotal;
  if(metricKey==='savings') return t.savingsTotal;
  if(metricKey==='netRelease') return t.netTotal;
  if(metricKey==='expenses') return t.expTotal;
  return 0;
}
function buildTrendSeries(){
  var rangeDays = Math.min(90, state.trendRange || 30);
  var days = buildDateRange(rangeDays);
  var pool = visibleReports();
  var byDate = {};
  pool.forEach(function(r){ (byDate[r.date] = byDate[r.date]||[]).push(r); });
  return days.map(function(d){
    var reports = byDate[d]||[];
    var value = 0; reports.forEach(function(r){ value += metricTotalForReport(r, state.trendMetric); });
    return {date:d, value:value, count:reports.length};
  });
}
function collectorMetricValue(report, collectorName, metricKey){
  var row = null;
  for(var i=0;i<report.collectors.length;i++){ if((report.collectors[i].name||'').trim().toLowerCase()===collectorName.toLowerCase()){ row = report.collectors[i]; break; } }
  if(metricKey==='collection') return row? num(row.collection) : 0;
  if(metricKey==='savings') return row? num(row.savings) : 0;
  if(metricKey==='netRelease'){
    var sum=0; report.releases.forEach(function(x){ if((x.fo||'').trim().toLowerCase()===collectorName.toLowerCase()){ sum += num(x.loan)-num(x.notary)-num(x.fees1)-num(x.fees34)-num(x.advance); } });
    return sum;
  }
  return 0;
}
function buildPerCollectorSeries(){
  var rangeDays = Math.min(90, state.trendRange || 30);
  var days = buildDateRange(rangeDays);
  var pool = visibleReports();
  var byDate = {};
  pool.forEach(function(r){ (byDate[r.date] = byDate[r.date]||[]).push(r); });
  var nameSet = {};
  pool.forEach(function(r){ r.collectors.forEach(function(c){ if(c.name && c.name.trim()) nameSet[c.name.trim()]=true; }); });
  var nameList = Object.keys(nameSet).length? Object.keys(nameSet) : ['Casanova','Magno','Josol','Rabanes','Bulic'];
  var metricKey = state.trendMetric==='expenses' ? 'collection' : state.trendMetric;
  var seriesByName = nameList.map(function(name){
    var points = days.map(function(d){
      var reports = byDate[d]||[];
      var value = 0; reports.forEach(function(r){ value += collectorMetricValue(r,name,metricKey); });
      return {date:d, value:value, count:reports.length};
    });
    return {name:name, points:points};
  });
  return {days:days, seriesByName:seriesByName};
}
function buildLineChartSVG(series){
  var W=880,H=300,padL=58,padR=16,padT=16,padB=34;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var maxVal = Math.max.apply(null, [1].concat(series.map(function(p){return p.value;}))) * 1.15;
  var n = series.length;
  function xFor(i){ return padL + (n<=1? plotW/2 : (i/(n-1))*plotW); }
  function yFor(v){ return padT + plotH - (v/maxVal)*plotH; }
  var grid = [0,0.25,0.5,0.75,1].map(function(f){
    var v = maxVal*f, y = yFor(v);
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--paper-line)" stroke-width="1"/>'+
           '<text x="'+(padL-8)+'" y="'+(y+4)+'" font-size="10" fill="var(--ink-soft)" text-anchor="end">'+fmt(Math.round(v))+'</text>';
  }).join('');
  var pathD = series.map(function(p,i){ return (i===0?'M':'L')+xFor(i).toFixed(1)+','+yFor(p.value).toFixed(1); }).join(' ');
  var points = series.map(function(p,i){
    var has = p.count>0;
    return '<circle cx="'+xFor(i).toFixed(1)+'" cy="'+yFor(p.value).toFixed(1)+'" r="'+(has?5:2.5)+'" fill="'+(has? 'var(--gold)':'var(--paper-line)')+'" stroke="var(--surface)" stroke-width="1.5" class="'+(has?'trend-pt':'trend-pt-empty')+'" data-point-date="'+p.date+'" style="cursor:'+(has?'pointer':'default')+'"><title>'+fmtDate(p.date)+': '+fmt(p.value)+(has?'':' (no report)')+'</title></circle>';
  }).join('');
  var labelStep = Math.max(1, Math.round(n/7));
  var xLabels = series.map(function(p,i){ return {p:p,i:i}; }).filter(function(o){ return o.i%labelStep===0 || o.i===n-1; })
    .map(function(o){ return '<text x="'+xFor(o.i).toFixed(1)+'" y="'+(H-10)+'" font-size="10" fill="var(--ink-soft)" text-anchor="middle">'+o.p.date.slice(5)+'</text>'; }).join('');
  return '<div class="trend-chart-wrap"><svg viewBox="0 0 '+W+' '+H+'">'+grid+'<path d="'+pathD+'" fill="none" stroke="var(--green)" stroke-width="2.5"/>'+points+xLabels+'</svg></div>';
}
function buildMultiLineChartSVG(days, seriesByName){
  var W=880,H=320,padL=58,padR=16,padT=16,padB=34;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var allVals = [];
  seriesByName.forEach(function(s){ s.points.forEach(function(p){ allVals.push(p.value); }); });
  var maxVal = Math.max.apply(null, [1].concat(allVals)) * 1.15;
  var n = days.length;
  function xFor(i){ return padL + (n<=1? plotW/2 : (i/(n-1))*plotW); }
  function yFor(v){ return padT + plotH - (v/maxVal)*plotH; }
  var grid = [0,0.25,0.5,0.75,1].map(function(f){
    var v = maxVal*f, y = yFor(v);
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--paper-line)" stroke-width="1"/>'+
           '<text x="'+(padL-8)+'" y="'+(y+4)+'" font-size="10" fill="var(--ink-soft)" text-anchor="end">'+fmt(Math.round(v))+'</text>';
  }).join('');
  var lines = seriesByName.map(function(s,si){
    var color = COLLECTOR_COLORS[si % COLLECTOR_COLORS.length];
    var pathD = s.points.map(function(p,i){ return (i===0?'M':'L')+xFor(i).toFixed(1)+','+yFor(p.value).toFixed(1); }).join(' ');
    var pts = s.points.map(function(p,i){
      if(p.count<=0) return '';
      return '<circle cx="'+xFor(i).toFixed(1)+'" cy="'+yFor(p.value).toFixed(1)+'" r="4" fill="'+color+'" stroke="var(--surface)" stroke-width="1.3" class="trend-pt" data-point-date="'+p.date+'" style="cursor:pointer"><title>'+esc(s.name)+' · '+fmtDate(p.date)+': '+fmt(p.value)+'</title></circle>';
    }).join('');
    return '<path d="'+pathD+'" fill="none" stroke="'+color+'" stroke-width="2" opacity="0.9"/>'+pts;
  }).join('');
  var labelStep = Math.max(1, Math.round(n/7));
  var xLabels = days.map(function(d,i){ return {d:d,i:i}; }).filter(function(o){ return o.i%labelStep===0 || o.i===n-1; })
    .map(function(o){ return '<text x="'+xFor(o.i).toFixed(1)+'" y="'+(H-10)+'" font-size="10" fill="var(--ink-soft)" text-anchor="middle">'+o.d.slice(5)+'</text>'; }).join('');
  var legend = seriesByName.map(function(s,si){
    var color = COLLECTOR_COLORS[si % COLLECTOR_COLORS.length];
    return '<div style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);"><span style="width:10px; height:10px; border-radius:50%; background:'+color+'; display:inline-block;"></span>'+esc(s.name)+'</div>';
  }).join('');
  return '<div class="trend-chart-wrap"><svg viewBox="0 0 '+W+' '+H+'">'+grid+lines+xLabels+'</svg></div><div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:12px;">'+legend+'</div>';
}

  return (

    '<option value="60" '+(state.trendRange===60?'selected':'')+'>60 days</option>'+
    '<option value="90" '+(state.trendRange===90?'selected':'')+'>90 days (max)</option></select></div>'+
    '<div class="field"><label>View</label><div style="display:flex; gap:6px;">'+viewBtns+'</div></div>'+
    '<div class="field"><label>Metric</label><div style="display:flex; gap:6px; flex-wrap:wrap;">'+metricBtns+'</div></div></div>'+
  '<div class="section"><p class="hint">Click a dot to open that day\'s report.'+(state.trendView==='perCollector'?'':' Grey dots mean no report was saved that day.')+'</p>'+chartHtml+'</div>'+

function jumpToDate(date){

/* ============================== WEEKLY ============================== */
function renderWeekly(){
  var u = state.currentUser;
  var start = state.weekStart;
  var days = [];
  for(var i=0;i<6;i++){ var d = new Date(start+'T00:00:00'); d.setDate(d.getDate()+i); days.push(d.toISOString().slice(0,10)); }
  var dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat'];

  var pool = visibleReports();
  var weekReports = pool.filter(function(r){ return days.indexOf(r.date)!==-1; });
  var byDate = {}; weekReports.forEach(function(r){ byDate[r.date]=r; });

  var nameSet = {};
  weekReports.forEach(function(r){ r.collectors.forEach(function(c){ if(c.name && c.name.trim()) nameSet[c.name.trim()]=true; }); });
  var nameList = Object.keys(nameSet).length? Object.keys(nameSet) : ['Casanova','Magno','Josol','Rabanes','Bulic'];

  function cell(date,name,field){
    var r = byDate[date]; if(!r) return null;
    var c = null;
    for(var i=0;i<r.collectors.length;i++){ if((r.collectors[i].name||'').trim().toLowerCase()===name.toLowerCase()){ c=r.collectors[i]; break; } }
    return c? num(c[field]) : null;
  }

  var rows = nameList.map(function(name){
    var cells = days.map(function(d){ var v = cell(d,name,'collection'); return '<td>'+(v===null? '<span class="zero">—</span>' : fmt(v))+'</td>'; }).join('');
    var rowTotal = 0; days.forEach(function(d){ rowTotal += (cell(d,name,'collection')||0); });
    return '<tr><td>'+esc(name)+'</td>'+cells+'<td>'+fmt(rowTotal)+'</td></tr>';
  }).join('');

  function sumRow(field,label){
    var cells = days.map(function(d){
      var r = byDate[d]; if(!r) return '<td><span class="zero">—</span></td>';
      var s=0; r.collectors.forEach(function(c){ s+=num(c[field]); });
      return '<td>'+fmt(s)+'</td>';
    }).join('');
    var total=0; days.forEach(function(d){ var r=byDate[d]; if(r) r.collectors.forEach(function(c){ total+=num(c[field]); }); });
    return '<tr><td>'+label+'</td>'+cells+'<td>'+fmt(total)+'</td></tr>';
  }

  var filterBar = (u.role==='dev'||u.role==='owner') ? (
    '<div class="branch-filter"><label style="font-size:11.5px; color:var(--ink-soft);">Branch</label><select id="branchFilterSel">'+
    '<option value="__all__" '+(state.branchFilter==='__all__'?'selected':'')+'>All branches</option>'+
    state.branches.map(function(b){ return '<option value="'+esc(b)+'" '+(state.branchFilter===b?'selected':'')+'>'+esc(b)+'</option>'; }).join('')+
    '</select></div>') : '';

  return '<div class="sheet"><div class="sheet-header"><h2>Weekly summary</h2>'+filterBar+'<span class="meta">Week of '+fmtDate(start)+'</span></div>'+
    '<div class="week-picker"><div class="field"><label>Week starting (Monday)</label><input type="date" id="weekStartInput" value="'+esc(start)+'"></div>'+
    '<button class="btn secondary" id="prevWeek">◀ Prev week</button><button class="btn secondary" id="nextWeek">Next week ▶</button></div>'+
    '<div class="section" style="overflow-x:auto;"><table class="weekly"><thead><tr><th>Collector</th>'+
    dayLabels.map(function(l,i){ return '<th>'+l+'<br><span style="font-weight:400;font-size:10px;">'+days[i].slice(5)+'</span></th>'; }).join('')+
    '<th>Week total</th></tr></thead><tbody>'+rows+'</tbody><tfoot>'+sumRow('collection','Total collection')+sumRow('savings','Savings')+sumRow('advance','Advance')+'</tfoot></table></div>'+
    '<p class="small-note">Figures pull automatically from saved daily reports whose date falls in this week (Sundays excluded — business closed). Days without a saved report show a dash.</p></div>';
}

/* ============================== FIELD HELPERS ============================== */
function setDeep(obj, path, value){
  var parts = path.split('.');
  var cur = obj;
  for(var i=0;i<parts.length-1;i++){ var p = parts[i]; cur = cur[isFinite(p)? parseInt(p,10): p]; }
  var last = parts[parts.length-1];
  cur[isFinite(last)? parseInt(last,10) : last] = value;
}
function clearReview(group){ if(state.draft._review) state.draft._review[group] = false; }

function renderInPlace(){
  var active = document.activeElement;
  var path = active && active.dataset ? active.dataset.f : null;
  var selStart = active && active.selectionStart;
  var selEnd = active && active.selectionEnd;
  render();
  if(path){
    var el = document.querySelector('[data-f="'+path+'"]');
    if(el){ el.focus(); try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
  }
}

/* ============================== EVENT HANDLING ============================== */
function attachAppHandlers(){
  var switchBtn = document.getElementById('switchUserBtn');
  if(switchBtn) switchBtn.onclick = function(){ state.currentUser = null; render(); };
  var tabBtns = document.querySelectorAll('.tab-btn');
  for(var i=0;i<tabBtns.length;i++){
    (function(b){ b.onclick = function(){ state.tab=b.dataset.tab; if(b.dataset.tab==='history') state.historyDateFilter=null; render(); }; })(tabBtns[i]);
  }
  var branchFilterSel = document.getElementById('branchFilterSel');
  if(branchFilterSel) branchFilterSel.onchange = function(){ state.branchFilter = branchFilterSel.value; render(); };

  if(state.tab==='new') attachNewReportHandlers();
  if(state.tab==='trends') attachTrendsHandlers();
  if(state.tab==='history') attachHistoryHandlers();
  if(state.tab==='weekly') attachWeeklyHandlers();
}

function attachTrendsHandlers(){
  var rangeSel = document.getElementById('trendRangeSel');
  if(rangeSel) rangeSel.onchange = function(){ state.trendRange = Math.min(90, parseInt(rangeSel.value,10)); render(); };
  var metricBtns = document.querySelectorAll('[data-metric]');
  for(var i=0;i<metricBtns.length;i++){ (function(b){ b.onclick = function(){ state.trendMetric = b.dataset.metric; render(); }; })(metricBtns[i]); }
  var viewBtns = document.querySelectorAll('[data-view]');
  for(var j=0;j<viewBtns.length;j++){ (function(b){ b.onclick = function(){ state.trendView = b.dataset.view; render(); }; })(viewBtns[j]); }
  var pts = document.querySelectorAll('.trend-pt');
  for(var k=0;k<pts.length;k++){ (function(el){ el.onclick = function(){ jumpToDate(el.dataset.pointDate); }; })(pts[k]); }
}

function attachNewReportHandlers(){
  var c = document.getElementById('appRoot');
  var fields = c.querySelectorAll('[data-f]');
  for(var i=0;i<fields.length;i++){
    (function(el){ el.oninput = function(){ setDeep(state.draft, el.dataset.f, el.value); clearReview(el.dataset.f.split('.')[0]); renderInPlace(); }; })(fields[i]);
  }

  var dateEl = document.getElementById('f-date'); if(dateEl) dateEl.onchange = function(){ state.draft.date = dateEl.value; clearReview('header'); };
  var branchEl = document.getElementById('f-branch');
  if(branchEl) branchEl.onchange = async function(){
    if(branchEl.value==='__new__'){
      var nb = prompt('New branch name:');
      if(nb && nb.trim()){ await addBranch(nb.trim()); state.draft.branch = nb.trim(); }
      render();
    } else { state.draft.branch = branchEl.value; clearReview('header'); }
  };
  var prepEl = document.getElementById('f-preparedBy'); if(prepEl) prepEl.oninput = function(){ state.draft.preparedBy = prepEl.value; clearReview('header'); };
  var begEl = document.getElementById('f-beginningCash'); if(begEl) begEl.oninput = function(){ state.draft.beginningCash = begEl.value; clearReview('header'); renderInPlace(); };
  var notesEl = document.getElementById('f-notes'); if(notesEl) notesEl.oninput = function(){ state.draft.notes = notesEl.value; };

  var delBtns = c.querySelectorAll('[data-del]');
  for(var d=0; d<delBtns.length; d++){
    (function(btn){ btn.onclick = function(){
      var parts = btn.dataset.del.split('.'); var group=parts[0], idx=parts[1];
      state.draft[group].splice(parseInt(idx,10),1);
      if(state.draft[group].length===0){
        if(group==='collectors') state.draft.collectors.push(blankCollector(''));
        if(group==='releases') state.draft.releases.push(blankRelease());
        if(group==='expenses') state.draft.expenses.push({label:'',amount:''});
      }
      render();
    }; })(delBtns[d]);
  }
  var addBtns = c.querySelectorAll('[data-add]');
  for(var a=0;a<addBtns.length;a++){
    (function(btn){ btn.onclick = function(){
      var g = btn.dataset.add;
      if(g==='collectors') state.draft.collectors.push(blankCollector(''));
      if(g==='releases') state.draft.releases.push(blankRelease());
      if(g==='expenses') state.draft.expenses.push({label:'',amount:''});
      render();
    }; })(addBtns[a]);
  }

  var uploadBox = document.getElementById('uploadBox');
  var fileInput = document.getElementById('fileInput');
  if(uploadBox){
    uploadBox.onclick = function(){ fileInput.click(); };
    uploadBox.ondragover = function(e){ e.preventDefault(); uploadBox.style.borderColor='var(--green)'; };
    uploadBox.ondragleave = function(){ uploadBox.style.borderColor=''; };
    uploadBox.ondrop = async function(e){ e.preventDefault(); uploadBox.style.borderColor=''; await handleFiles(e.dataTransfer.files); };
  }
  if(fileInput) fileInput.onchange = async function(){ await handleFiles(fileInput.files); fileInput.value=''; };

  var rmImgBtns = c.querySelectorAll('[data-rm-img]');
  for(var ri=0; ri<rmImgBtns.length; ri++){ (function(btn){ btn.onclick = function(){ state.draft.images.splice(parseInt(btn.dataset.rmImg,10),1); render(); }; })(rmImgBtns[ri]); }
  var rmFileBtns = c.querySelectorAll('[data-rm-file]');
  for(var rf=0; rf<rmFileBtns.length; rf++){ (function(btn){ btn.onclick = function(){ state.draft.files.splice(parseInt(btn.dataset.rmFile,10),1); render(); }; })(rmFileBtns[rf]); }

  var fillImgBtns = c.querySelectorAll('[data-fill-img]');
  for(var fi=0; fi<fillImgBtns.length; fi++){
    (function(btn){ btn.onclick = async function(){
      var idx = parseInt(btn.dataset.fillImg,10);
      if(!confirmOverwriteIfNeeded()) return;
      btn.disabled = true; btn.textContent = 'Reading...';
      try{
        var ex = await extractReportFromImage(state.draft.images[idx]);
        mergeExtracted(state.draft, ex);
        await logAction('image_auto_fill', 'Auto-filled from photo ('+(state.draft.branch||'—')+', '+state.draft.date+')');
        render();
      }catch(e){
        await logAction('error', 'Auto-fill from photo failed: '+(e.message||e));
        alert("Couldn't read that photo automatically. Please enter the figures manually.");
        btn.disabled = false; btn.textContent = 'Auto-fill from this ✨';
      }
    }; })(fillImgBtns[fi]);
  }
  var fillFileBtns = c.querySelectorAll('[data-fill-file]');
  for(var ff=0; ff<fillFileBtns.length; ff++){
    (function(btn){ btn.onclick = async function(){
      var idx = parseInt(btn.dataset.fillFile,10);
      if(!confirmOverwriteIfNeeded()) return;
      btn.disabled = true; btn.textContent = 'Reading...';
      try{
        var ex = await extractReportFromCSV(state.draft.files[idx].csv);
        mergeExtracted(state.draft, ex);
        await logAction('csv_auto_fill', 'Auto-filled from CSV "'+state.draft.files[idx].name+'" ('+(state.draft.branch||'—')+', '+state.draft.date+')');
        render();
      }catch(e){
        await logAction('error', 'Auto-fill from CSV failed: '+(e.message||e));
        alert("Couldn't read that file automatically. Please enter the figures manually.");
        btn.disabled = false; btn.textContent = 'Auto-fill from this ✨';
      }
    }; })(fillFileBtns[ff]);
  }

  var saveBtn = document.getElementById('saveReport');
  if(saveBtn) saveBtn.onclick = async function(){
    if(!state.draft.branch){ alert('Please choose a branch.'); return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Saving...';
    if(state.editingId) state.draft.id = state.editingId;
    var wasEdit = !!state.editingId;
    var ok = await saveReport(state.draft, wasEdit);
    if(ok){
      state.editingId = null;
      var nextBranch = (state.currentUser.role==='cashier') ? state.currentUser.branch : state.draft.branch;
      state.draft = blankReport(nextBranch);
      state.draft.preparedBy = state.currentUser.name;
      await loadReports();
      state.tab = 'history';
      state.openHistoryId = null;
      render();
    } else { saveBtn.disabled = false; saveBtn.textContent = 'Save report'; }
  };
  var clearBtn = document.getElementById('clearDraft');
  if(clearBtn) clearBtn.onclick = function(){ if(confirm('Clear all fields in this form?')){ var b=state.draft.branch; state.draft = blankReport(b); state.draft.preparedBy = state.currentUser.name; render(); } };
  var cancelBtn = document.getElementById('cancelEdit');
  if(cancelBtn) cancelBtn.onclick = function(){ state.editingId=null; state.draft = blankReport(state.currentUser.branch); state.tab='history'; render(); };
}

function confirmOverwriteIfNeeded(){
  var r = state.draft;
  var hasData = r.collectors.some(function(x){return x.collection;}) || r.releases.some(function(x){return x.loan;}) || r.expenses.some(function(x){return x.amount;});
  if(hasData) return confirm('This will overwrite fields that are found in the upload. Continue?');
  return true;
}

function attachHistoryHandlers(){
  var toggles = document.querySelectorAll('[data-toggle]');
  for(var i=0;i<toggles.length;i++){ (function(el){ el.onclick = function(){ var id = el.dataset.toggle; state.openHistoryId = state.openHistoryId===id? null : id; render(); }; })(toggles[i]); }
  var editBtns = document.querySelectorAll('[data-edit-report]');
  for(var j=0;j<editBtns.length;j++){
    (function(btn){ btn.onclick = function(){
      var r = null;
      for(var k=0;k<state.reports.length;k++){ if(state.reports[k].id===btn.dataset.editReport){ r=state.reports[k]; break; } }
      if(r){ state.draft = JSON.parse(JSON.stringify(r)); state.draft._review = {header:false,collectors:false,releases:false,expenses:false,denom:false}; if(!state.draft.files) state.draft.files=[]; state.editingId = r.id; state.tab='new'; render(); }
    }; })(editBtns[j]);
  }
  var delBtns = document.querySelectorAll('[data-del-report]');
  for(var d=0; d<delBtns.length; d++){ (function(btn){ btn.onclick = function(){ if(confirm('Delete this report? This cannot be undone.')) deleteReport(btn.dataset.delReport); }; })(delBtns[d]); }
  var clearDateBtn = document.getElementById('clearDateFilter');
  if(clearDateBtn) clearDateBtn.onclick = function(){ state.historyDateFilter = null; render(); };
}

function attachWeeklyHandlers(){
  var wsInput = document.getElementById('weekStartInput');
  if(wsInput) wsInput.onchange = function(){ state.weekStart = mondayOf(wsInput.value); render(); };
  var prev = document.getElementById('prevWeek');
  if(prev) prev.onclick = function(){ var d=new Date(state.weekStart+'T00:00:00'); d.setDate(d.getDate()-7); state.weekStart=d.toISOString().slice(0,10); render(); };
  var next = document.getElementById('nextWeek');
  if(next) next.onclick = function(){ var d=new Date(state.weekStart+'T00:00:00'); d.setDate(d.getDate()+7); state.weekStart=d.toISOString().slice(0,10); render(); };
}

async function handleFiles(fileList){
  var files = Array.prototype.slice.call(fileList);
  for(var i=0;i<files.length;i++){
    var f = files[i];
    if(f.type.indexOf('image/')===0){
      try{ var dataUrl = await resizeImage(f); state.draft.images.push(dataUrl); }catch(e){}
    } else if(/\.csv$/i.test(f.name)){
      try{ var csv = await readTextFile(f); state.draft.files.push({name:f.name, csv:csv}); }
      catch(e){ alert('Could not read '+f.name); }
    } else {
      alert(f.name+' is not supported yet. Please upload an image or a .csv file.');
    }
  }
  render();
}

/* ============================== INIT ============================== */
function showFatalError(err){
  var root = document.getElementById('appRoot');
  if(!root) return;
  root.innerHTML = '<div style="padding:40px; color:#E9E5D6; font-family:sans-serif; max-width:500px; margin:0 auto;">'+
    '<h2 style="color:#C7DFC9;">The app hit a problem while starting up.</h2>'+
    '<p style="color:#8FA093;">Try reloading. If it keeps happening, the error was:</p>'+
    '<pre style="white-space:pre-wrap; color:#E2825B; font-size:12px;">'+esc(err && err.message || err)+'</pre></div>';
}
window.addEventListener('error', function(e){
  var root = document.getElementById('appRoot');
  if(root && !root.innerHTML.trim()) showFatalError(e.error || e.message);
});

async function init(){
  // Give the Firebase module script a chance to connect (max 4s), then proceed either way.
  await Promise.race([ window.storageReady, new Promise(function(r){ setTimeout(r, 4000); }) ]);
  await loadBranches();
  await loadProfile();
  await loadReports();
  state.usingFallbackData = !hasStorage();
  render();
}
init().catch(showFatalError);

})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteDoc,
    collection, query, where, getDocs, documentId
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // 1) Paste your Firebase project's config here (from Firebase Console >
  //    Project settings > General > Your apps > Web app).
  const firebaseConfig = {
    apiKey: "AIzaSyDJY7C5OFZGCuoUpXHMU7P8bUfPH9cs_1Y",
    authDomain: "cashier-ledger.firebaseapp.com",
    projectId: "cashier-ledger",
    storageBucket: "cashier-ledger.firebasestorage.app",
    messagingSenderId: "909971740365",
    appId: "1:909971740365:web:b5944c2bfe4a9b1a93bb84"
  };

  try{
    // If the config above hasn't been filled in, skip connecting — the app
    // will fall back to its built-in sample data instead of hanging.
    if(firebaseConfig.apiKey.indexOf('PASTE_') === 0){
      console.warn('Firebase config not filled in yet — using sample data.');
      window.__markStorageReady(false);
    } else {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const kv = collection(db, 'kv');

      window.storage = {
        async get(key, shared){
          const snap = await getDoc(doc(kv, key));
          if(!snap.exists()) throw new Error('not found: '+key);
          const data = snap.data();
          return { key, value: data.value, shared: !!data.shared };
        },
        async set(key, value, shared){
          await setDoc(doc(kv, key), { value: value, shared: !!shared, updatedAt: Date.now() });
          return { key, value, shared };
        },
        async delete(key, shared){
          await deleteDoc(doc(kv, key));
          return { key, deleted: true, shared };
        },
        async list(prefix, shared){
          const q = query(kv, where(documentId(), '>=', prefix), where(documentId(), '<', prefix + '\uf8ff'));
          const snaps = await getDocs(q);
          const keys = [];
          snaps.forEach(function(d){ keys.push(d.id); });
          return { keys: keys, prefix: prefix, shared: shared };
        }
      };
      window.__markStorageReady(true);
    }
  }catch(err){
    console.error('Firebase failed to initialize:', err);
    window.__markStorageReady(false);
  }
</script>
